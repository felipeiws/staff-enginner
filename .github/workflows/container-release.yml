name: Imagens de container

on:
  pull_request:
    paths:
      - '**/Dockerfile'
      - '**/Dockerfile.*'
      - '**/Containerfile'
      - '**/Containerfile.*'
      - '.github/workflows/container-release.yml'
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - '**/Dockerfile'
      - '**/Dockerfile.*'
      - '**/Containerfile'
      - '**/Containerfile.*'
      - '.github/workflows/container-release.yml'

permissions:
  contents: read

jobs:
  build-scan-and-publish:
    name: Construir, gerar SBOM e varrer imagens
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.68.2
      - name: Construir, gerar SBOM e bloquear vulnerabilidade crítica
        id: images
        env:
          IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/atlas
        run: |
          set -euo pipefail
          shopt -s nullglob globstar
          dockerfiles=(**/Dockerfile **/Dockerfile.* **/Containerfile **/Containerfile.*)
          if [ "${#dockerfiles[@]}" -eq 0 ]; then
            echo 'Nenhum Dockerfile/Containerfile encontrado; não há imagem a construir.'
            exit 0
          fi
          images=()
          for dockerfile in "${dockerfiles[@]}"; do
            service="$(dirname "$dockerfile" | tr '/' '-' | sed 's/^\.//; s/^-//')"
            service="${service:-app}"
            image="${IMAGE_PREFIX}-${service}:${GITHUB_SHA}"
            docker build --file "$dockerfile" --tag "$image" .
            trivy image --exit-code 1 --severity CRITICAL --ignore-unfixed=false "$image"
            trivy image --format cyclonedx --output "sbom-image-${service}.cdx.json" "$image"
            images+=("$image")
          done
          printf '%s\n' "${images[@]}" > images.txt
      - name: Publicar SBOMs CycloneDX das imagens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sboms-imagens-cyclonedx
          path: sbom-image-*.cdx.json
          if-no-files-found: warn
      - name: Autenticar no GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v') && hashFiles('images.txt') != ''
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publicar imagens verificadas
        if: startsWith(github.ref, 'refs/tags/v') && hashFiles('images.txt') != ''
        run: xargs --no-run-if-empty --max-lines=1 docker push < images.txt
      - name: Instalar Cosign
        if: startsWith(github.ref, 'refs/tags/v') && hashFiles('images.txt') != ''
        uses: sigstore/cosign-installer@v3.9.2
      - name: Assinar imagens publicadas por identidade OIDC
        if: startsWith(github.ref, 'refs/tags/v') && hashFiles('images.txt') != ''
        run: xargs --no-run-if-empty --max-lines=1 cosign sign --yes < images.txt
