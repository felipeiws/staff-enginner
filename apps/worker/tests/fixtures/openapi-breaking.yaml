openapi: 3.1.0
info:
  title: Compras API
  version: 3.0.0
paths:
  /purchase-orders/{id}:
    delete:
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: motivo
          in: query
          required: true
          schema: { type: string }
      responses:
        '409': { description: Regra de negócio violada. }
