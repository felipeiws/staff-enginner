[project]
name = "atlas-worker"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pypdf>=5,<7", "PyYAML>=6,<7", "redis>=5.2,<6", "Pillow>=10,<12", "pytesseract>=0.3,<1", "playwright>=1.64.0,<2"]

[project.optional-dependencies]
dev = ["mypy>=1.14", "pytest>=8.0", "ruff>=0.8"]

[project.scripts]
atlas-worker = "atlas_worker.main:main"

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["atlas_worker"]
