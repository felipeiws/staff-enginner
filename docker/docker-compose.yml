services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-atlas}
      POSTGRES_USER: ${POSTGRES_USER:-atlas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atlas_local_password}
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  redis:
    image: redis:7.4.2-alpine
    command: ['redis-server', '--appendonly', 'yes']
    ports:
      - '${REDIS_PORT:-6379}:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s

  typesense:
    image: typesense/typesense:27.1
    command: >-
      --data-dir /data
      --api-key=${TYPESENSE_API_KEY:-atlas-local-typesense-key-change-me}
      --enable-cors
    ports:
      - '${TYPESENSE_PORT:-8108}:8108'
    volumes:
      - typesense-data:/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'bash -ec ''exec 3<>/dev/tcp/127.0.0.1/8108; printf "GET /health HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n" >&3; IFS= read -r status <&3; [[ "$$status" == *"200"* ]]''',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-atlasminio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-atlasminio_local_password}
    ports:
      - '${MINIO_API_PORT:-9000}:9000'
      - '${MINIO_CONSOLE_PORT:-9001}:9001'
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9000/minio/health/live || exit 1']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.22.3
    command: ['--database', '/data/mailpit.db']
    ports:
      - '${MAILPIT_SMTP_PORT:-1025}:1025'
      - '${MAILPIT_WEB_PORT:-8025}:8025'
    volumes:
      - mailpit-data:/data
    healthcheck:
      test:
        ['CMD-SHELL', 'wget --no-verbose --tries=1 --spider http://localhost:8025/livez || exit 1']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  prometheus:
    image: prom/prometheus:v3.2.1
    command: ['--config.file=/etc/prometheus/prometheus.yml']
    ports: ['${PROMETHEUS_PORT:-9090}:9090']
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  tempo:
    image: grafana/tempo:2.7.1
    command: ['-config.file=/etc/tempo.yml']
    ports: ['${TEMPO_PORT:-3200}:3200', '${OTLP_GRPC_PORT:-4317}:4317', '${OTLP_HTTP_PORT:-4318}:4318']
    volumes:
      - ./observability/tempo.yml:/etc/tempo.yml:ro

  grafana:
    image: grafana/grafana:11.5.2
    ports: ['${GRAFANA_PORT:-3000}:3000']
    volumes:
      - ./observability/grafana-datasources.yml:/etc/grafana/provisioning/datasources/atlas.yml:ro
      - ./observability/grafana-dashboard-provider.yml:/etc/grafana/provisioning/dashboards/atlas.yml:ro
      - ./observability/dashboards:/var/lib/grafana/dashboards:ro
    depends_on: [prometheus, tempo]

volumes:
  postgres-data:
  redis-data:
  typesense-data:
  minio-data:
  mailpit-data:
