name: atlas

# Cópia de docker/docker-compose.production.yml adaptada para painéis (EasyPanel
# e similares) que resolvem o arquivo .env relativo à raiz do projeto clonado,
# não ao diretório do arquivo docker-compose indicado. Mantenha em sincronia
# manualmente com docker/docker-compose.production.yml (usado pelo fluxo
# self-hosted via scripts/install-self-hosted.sh e scripts/update-self-hosted.sh,
# que já passam --env-file explicitamente e não sofrem desse problema).
# Ver docs/deployment/easypanel.md.

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    security_opt: [no-new-privileges:true]

  redis:
    image: redis:7.4.2-alpine
    restart: unless-stopped
    command:
      [
        'redis-server',
        '--appendonly',
        'yes',
        '--requirepass',
        '${REDIS_PASSWORD:?defina REDIS_PASSWORD}',
      ]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?defina REDIS_PASSWORD}
    volumes: [redis-data:/data]
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli --no-auth-warning -a "$$REDIS_PASSWORD" ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    security_opt: [no-new-privileges:true]

  typesense:
    image: typesense/typesense:27.1
    restart: unless-stopped
    command: >-
      --data-dir /data
      --api-key=${TYPESENSE_API_KEY:?defina TYPESENSE_API_KEY}
      --enable-cors=false
    volumes: [typesense-data:/data]
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - 'exec 3<>/dev/tcp/127.0.0.1/8108; printf "GET /health HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3; cat <&3 | grep -q "\"ok\":true"'
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    security_opt: [no-new-privileges:true]

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?defina MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD}
    volumes: [minio-data:/data]
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://127.0.0.1:9000/minio/health/live']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    security_opt: [no-new-privileges:true]

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    restart: 'no'
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?defina MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?defina MINIO_ROOT_PASSWORD}
      AWS_BUCKET: ${AWS_BUCKET:?defina AWS_BUCKET}
    entrypoint: ['/bin/sh', '-ec']
    command:
      - >-
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$AWS_BUCKET"
    depends_on:
      minio: { condition: service_healthy }

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    image: ${ATLAS_BACKEND_IMAGE:-atlas/backend}:${ATLAS_VERSION:-local}
    restart: unless-stopped
    env_file: [.env]
    environment:
      APP_ENV: production
      APP_DEBUG: 'false'
      DB_HOST: postgres
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:?defina REDIS_PASSWORD}
      AWS_ENDPOINT: http://minio:9000
      TYPESENSE_HOST: typesense
      TYPESENSE_PORT: '8108'
      KNOWLEDGE_ENGINE_URL: http://backend-web:8080
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      typesense: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    healthcheck:
      test: ['CMD-SHELL', 'php artisan about --only=environment --no-ansi >/dev/null']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    security_opt: [no-new-privileges:true]

  backend-web:
    build:
      context: .
      dockerfile: docker/backend-web.Dockerfile
    image: ${ATLAS_BACKEND_WEB_IMAGE:-atlas/backend-web}:${ATLAS_VERSION:-local}
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/health | grep -q status']
      interval: 15s
      timeout: 5s
      retries: 5
    security_opt: [no-new-privileges:true]

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    image: ${ATLAS_WORKER_IMAGE:-atlas/worker}:${ATLAS_VERSION:-local}
    restart: unless-stopped
    env_file: [.env]
    environment:
      REDIS_URL: redis://:${REDIS_PASSWORD:?defina REDIS_PASSWORD}@redis:6379/0
      KNOWLEDGE_ENGINE_URL: http://backend-web:8080
    depends_on:
      redis: { condition: service_healthy }
      backend-web: { condition: service_healthy }
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'python -c "import urllib.request; urllib.request.urlopen(''http://127.0.0.1:8081/health'', timeout=3)"',
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt: [no-new-privileges:true]

  portal:
    build:
      context: .
      dockerfile: apps/portal/Dockerfile
    image: ${ATLAS_PORTAL_IMAGE:-atlas/portal}:${ATLAS_VERSION:-local}
    restart: unless-stopped
    depends_on:
      backend-web: { condition: service_healthy }
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://127.0.0.1:8080/health | grep -q ok']
      interval: 15s
      timeout: 5s
      retries: 5
    security_opt: [no-new-privileges:true]

  backup:
    build:
      context: .
      dockerfile: docker/backup/Dockerfile
    profiles: [backup]
    env_file: [.env]
    environment:
      POSTGRES_HOST: postgres
      MINIO_ENDPOINT: http://minio:9000
    volumes: [backup-data:/backups]
    depends_on:
      postgres: { condition: service_healthy }
      minio: { condition: service_healthy }
    security_opt: [no-new-privileges:true]

volumes:
  postgres-data:
  redis-data:
  typesense-data:
  minio-data:
  backup-data:
